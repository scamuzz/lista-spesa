<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>🛒 Lista della Spesa — Scamonzio</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; overflow-x: hidden; }
    body { font-family: 'Segoe UI', sans-serif; background: #fff8f0; min-height: 100vh; }

    /* ── HEADER ── */
    .header {
      background: linear-gradient(160deg, #b5451b 0%, #e8621a 50%, #f4a261 100%);
      color: white; padding: 52px 20px 36px; text-align: center; position: relative; overflow: hidden;
    }
    .header::before {
      content: ''; position: absolute; inset: 0;
      background: radial-gradient(ellipse 60% 40% at 20% 30%, rgba(255,255,255,0.10), transparent),
                  radial-gradient(ellipse 50% 35% at 80% 70%, rgba(255,255,255,0.07), transparent);
    }
    .home-btn {
      position: absolute; top: 14px; left: 14px; z-index: 10;
      background: rgba(255,255,255,0.85); color: #e8621a; border: none; border-radius: 20px;
      padding: 6px 14px; font-size: 0.82rem; font-weight: 700; cursor: pointer;
      text-decoration: none; display: inline-flex; align-items: center; gap: 5px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.12);
    }
    .header h1 { font-size: 2rem; font-weight: 900; text-shadow: 0 3px 12px rgba(0,0,0,0.25); position: relative; }
    .header .subtitle { font-size: 0.85rem; opacity: 0.90; margin-top: 8px; font-weight: 500; position: relative; }
    .header .date { font-size: 0.78rem; opacity: 0.85; margin-top: 4px; position: relative; }
    .particles { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
    .particle { position: absolute; border-radius: 50%; background: rgba(255,255,255,0.18); animation: floatUp linear infinite; }
    .particle:nth-child(1) { width:8px;  height:8px;  left:10%; bottom:0; animation-duration:6s;   animation-delay:0s;   }
    .particle:nth-child(2) { width:5px;  height:5px;  left:25%; bottom:0; animation-duration:4.5s; animation-delay:1s;   }
    .particle:nth-child(3) { width:10px; height:10px; left:42%; bottom:0; animation-duration:7s;   animation-delay:2s;   }
    .particle:nth-child(4) { width:6px;  height:6px;  left:60%; bottom:0; animation-duration:5s;   animation-delay:0.5s; }
    .particle:nth-child(5) { width:12px; height:12px; left:75%; bottom:0; animation-duration:8s;   animation-delay:1.5s; }
    .particle:nth-child(6) { width:4px;  height:4px;  left:88%; bottom:0; animation-duration:4s;   animation-delay:3s;   }
    @keyframes floatUp { 0%{transform:translateY(0) scale(1);opacity:0.8;} 100%{transform:translateY(-120px) scale(0.5);opacity:0;} }

    /* ── SYNC STATUS ── */
    .sync-status { display:flex; align-items:center; justify-content:center; gap:6px; font-size:0.72rem; margin-top:8px; opacity:0.9; position:relative; }
    .sync-dot { width:8px; height:8px; border-radius:50%; background:#fff; animation:pulse 1.5s infinite; flex-shrink:0; }
    .sync-dot.connected { background:#a5d6a7; animation:none; }
    .sync-dot.error { background:#ef9a9a; animation:none; }
    @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.3;} }

    /* ── WAVE ── */
    .wave-divider { display:block; line-height:0; overflow:hidden; background:linear-gradient(160deg,#b5451b 0%,#e8621a 50%,#f4a261 100%); }
    .wave-divider svg { display:block; width:100%; }

    /* ── CONTAINER ── */
    .container { max-width: 540px; margin: 0 auto; padding: 18px 14px 64px; }

    /* ── PROGRESS ── */
    .progress-card {
      background: white; border-radius: 14px; padding: 14px 16px;
      box-shadow: 0 3px 16px rgba(180,80,20,0.08); border: 2px solid #fbd5b5; margin-bottom: 12px;
    }
    .progress-bar-wrap .label {
      font-size: 0.73rem; color: #999; margin-bottom: 6px;
      display: flex; justify-content: space-between;
    }
    .progress-bar { height: 6px; background: #fde8d8; border-radius: 10px; overflow: hidden; }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #e8621a, #f4a261);
      border-radius: 10px; width: 0%; transition: width 0.4s ease;
    }

    /* ── FILTRI ── */
    .filters { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 12px; }
    .filter-btn {
      border: none; border-radius: 20px; padding: 5px 12px;
      font-size: 0.72rem; cursor: pointer; transition: all 0.2s;
      background: #fde8d8; color: #bf4a1a; font-weight: 700;
      white-space: nowrap;
    }
    .filter-btn.active, .filter-btn:hover { background: #e8621a; color: #fff; }

    /* ── LISTA ── */
    .list-card {
      background: white; border-radius: 14px;
      box-shadow: 0 3px 16px rgba(180,80,20,0.08); border: 2px solid #fbd5b5;
      overflow: hidden; margin-bottom: 12px;
    }
    .list { list-style: none; padding: 0 10px; }
    .list li {
      display: flex; align-items: center; gap: 8px;
      padding: 11px 8px; border-radius: 12px; cursor: pointer;
      transition: background 0.2s; border-bottom: 1px solid #f5ede8;
      min-width: 0;
    }
    .list li:last-child { border-bottom: none; }
    .list li:hover { background: #fff8f4; }
    .list li.checked { background: #fff3ee; }
    .list li.checked .item-name { text-decoration: line-through; color: #aaa; }

    .checkbox {
      width: 22px; height: 22px; border-radius: 50%; flex-shrink: 0;
      border: 2px solid #e8621a; display: flex; align-items: center;
      justify-content: center; transition: background 0.2s;
    }
    .list li.checked .checkbox { background: #e8621a; }
    .checkbox::after {
      content: '✓'; color: white; font-size: 0.7rem; font-weight: bold;
      opacity: 0; transition: opacity 0.2s;
    }
    .list li.checked .checkbox::after { opacity: 1; }

    .item-info { flex: 1; min-width: 0; overflow: hidden; }
    .item-name {
      font-size: 0.88rem; font-weight: 500; color: #333;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .item-brand {
      font-size: 0.7rem; color: #888; margin-top: 1px;
      text-transform: uppercase; white-space: nowrap;
      overflow: hidden; text-overflow: ellipsis;
    }

    .category-badge {
      font-size: 0.6rem; font-weight: 700; border-radius: 8px;
      padding: 2px 6px; white-space: nowrap; flex-shrink: 0;
      max-width: 90px; overflow: hidden; text-overflow: ellipsis;
    }

    /* nasconde badge su schermi piccoli per evitare overflow */
    @media (max-width: 360px) {
      .category-badge { display: none; }
    }

    .item-price {
      font-weight: 700; font-size: 0.85rem; color: #bf4a1a;
      white-space: nowrap; flex-shrink: 0;
    }
    .delete-btn {
      background: none; border: none; cursor: pointer; font-size: 0.95rem;
      color: #ccc; transition: color 0.2s; flex-shrink: 0;
      padding: 0 2px; line-height: 1; touch-action: manipulation;
    }
    .delete-btn:hover { color: #e53935; }

    /* ── TOTALE ── */
    .total-card {
      background: white; border-radius: 14px; padding: 12px 16px;
      box-shadow: 0 3px 16px rgba(180,80,20,0.08); border: 2px solid #fbd5b5;
      display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;
    }
    .total-label { font-size: 0.88rem; color: #666; }
    .total-price { font-size: 1.2rem; font-weight: 800; color: #bf4a1a; }

    /* ── FORM AGGIUNGI ── */
    .add-card { background:white; border-radius:18px; padding:18px; box-shadow:0 3px 16px rgba(180,80,20,0.08); border:2px solid #fbd5b5; margin-bottom:12px; }
    .add-card h3 { font-size:0.82rem; font-weight:800; color:#bf4a1a; margin-bottom:12px; text-transform:uppercase; letter-spacing:0.5px; }
    .add-form { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    .add-form input, .add-form select {
      border:1.5px solid #fbd5b5; border-radius:10px; padding:9px 10px; font-size:0.83rem; outline:none;
      transition:border-color 0.2s; color:#333; background:#fafafa; width:100%; min-width:0;
    }
    .add-form input:focus, .add-form select:focus { border-color:#e8621a; background:#fff; }
    .add-form .full { grid-column:1/-1; }
    .add-btn {
      grid-column:1/-1; background:linear-gradient(135deg,#e8621a,#f4a261); color:white; border:none;
      border-radius:10px; padding:12px; font-size:0.93rem; font-weight:700; cursor:pointer; transition:opacity 0.2s;
      touch-action:manipulation;
    }
    .add-btn:hover { opacity:0.88; }
    .add-btn:disabled { opacity:0.5; cursor:not-allowed; }

    /* ── SVUOTA ── */
    .clear-btn {
      display:block; width:100%; background:none; border:1.5px solid #fbd5b5; border-radius:10px;
      color:#e8621a; padding:9px; font-size:0.8rem; font-weight:600; cursor:pointer; transition:all 0.2s; margin-bottom:14px;
      touch-action:manipulation;
    }
    .clear-btn:hover { background:#fff3e8; }

    /* ── EMPTY ── */
    .empty-msg { text-align:center; padding:24px 0; color:#bbb; font-size:0.88rem; display:none; }
    .empty-msg .big { font-size:2rem; display:block; margin-bottom:6px; }

    /* ── PAGE FOOTER ── */
    .page-footer { text-align:center; font-size:0.7rem; color:#d4a88a; padding:8px 0 24px; letter-spacing:0.3px; }

    /* ── TOAST ── */
    .toast {
      position:fixed; bottom:20px; left:50%; transform:translateX(-50%) translateY(80px);
      background:#323232; color:#fff; padding:10px 20px; border-radius:20px; font-size:0.83rem;
      font-weight:500; transition:transform 0.3s ease; z-index:999; white-space:nowrap; max-width:calc(100vw - 32px);
    }
    .toast.show { transform:translateX(-50%) translateY(0); }
  </style>
</head>
<body>

<div class="header">
  <div class="particles">
    <div class="particle"></div><div class="particle"></div><div class="particle"></div>
    <div class="particle"></div><div class="particle"></div><div class="particle"></div>
  </div>
  <a class="home-btn" href="home.html">← Home</a>
  <h1>🛒 Lista della Spesa</h1>
  <div class="subtitle">Spesa condivisa della famiglia</div>
  <div class="date" id="today-date"></div>
  <div class="sync-status">
    <div class="sync-dot" id="sync-dot"></div>
    <span id="sync-label">Connessione in corso...</span>
  </div>
</div>

<div class="wave-divider">
  <svg viewBox="0 0 1440 72" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M0,36 C180,72 360,0 540,36 C720,72 900,0 1080,36 C1260,72 1380,12 1440,36 L1440,72 L0,72 Z" fill="#fff8f0"/>
    <path d="M0,50 C220,18 440,66 660,46 C880,26 1100,62 1320,44 L1440,50 L1440,72 L0,72 Z" fill="#fff8f0" opacity="0.55"/>
  </svg>
</div>

<div class="container">

  <div class="progress-card">
    <div class="progress-bar-wrap">
      <div class="label">
        <span id="progress-text">0 / 0 articoli</span>
        <span id="progress-pct">0%</span>
      </div>
      <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
    </div>
  </div>

  <div class="filters" id="filters"></div>

  <div class="list-card">
    <ul class="list" id="shopping-list"></ul>
    <div class="empty-msg" id="empty-msg">
      <span class="big">🛍️</span>Nessun articolo in questa categoria
    </div>
  </div>

  <div class="total-card">
    <span class="total-label">Totale stimato</span>
    <span class="total-price" id="total-price">€ 0,00</span>
  </div>

  <div class="add-card">
    <h3>➕ Aggiungi articolo</h3>
    <div class="add-form">
      <input type="text"   id="new-name"     placeholder="Prodotto *" class="full" />
      <input type="text"   id="new-brand"    placeholder="Marca (opz.)" />
      <input type="number" id="new-price"    placeholder="Prezzo €" step="0.01" min="0" />
      <select id="new-category">
        <option value="">— Categoria —</option>
        <option value="🥩 Carne">🥩 Carne</option>
        <option value="🐟 Pesce">🐟 Pesce</option>
        <option value="🥦 Verdura">🥦 Verdura</option>
        <option value="🍎 Frutta">🍎 Frutta</option>
        <option value="🧀 Latticini">🧀 Latticini</option>
        <option value="🍝 Pasta & Cereali">🍝 Pasta & Cereali</option>
        <option value="🍞 Pane & Bakery">🍞 Pane & Bakery</option>
        <option value="🫒 Condimenti & Oli">🫒 Condimenti & Oli</option>
        <option value="🍪 Snack & Dolci">🍪 Snack & Dolci</option>
        <option value="🥂 Vini & Bollicine">🥂 Vini & Bollicine</option>
        <option value="🍺 Birra & Bevande">🍺 Birra & Bevande</option>
        <option value="🧴 Igiene Personale">🧴 Igiene Personale</option>
        <option value="🧹 Pulizia Casa">🧹 Pulizia Casa</option>
        <option value="🍼 Neonati & Bambini">🍼 Neonati & Bambini</option>
        <option value="🐾 Animali">🐾 Animali</option>
        <option value="💊 Farmacia">💊 Farmacia</option>
        <option value="❓ Altro">❓ Altro</option>
      </select>
      <button class="add-btn" id="add-btn" onclick="addItem()">Aggiungi alla lista</button>
    </div>
  </div>

  <button class="clear-btn" onclick="clearChecked()">🗑️ Rimuovi articoli spuntati</button>

</div>

<div class="page-footer">🏠 Scamonzio &nbsp;•&nbsp; Lista della Spesa</div>
<div class="toast" id="toast"></div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyAfOMeAkXUIandLUhCR8nfyELOPVRyD3WU",
    authDomain: "lista-spesa-b9eb1.firebaseapp.com",
    databaseURL: "https://lista-spesa-b9eb1-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "lista-spesa-b9eb1",
    storageBucket: "lista-spesa-b9eb1.firebasestorage.app",
    messagingSenderId: "468690890938",
    appId: "1:468690890938:web:048be7f27779d8862d9283",
    measurementId: "G-5MMJ2MXX5E"
  };

  firebase.initializeApp(firebaseConfig);
  const db       = firebase.database();
  const itemsRef = db.ref('items');

  let items        = {};
  let activeFilter = 'tutti';

  const catColors = {
    "🥩 Carne":             { bg:'#fdecea', color:'#c62828' },
    "🐟 Pesce":             { bg:'#e3f2fd', color:'#1565c0' },
    "🥦 Verdura":           { bg:'#e8f5e9', color:'#2e7d32' },
    "🍎 Frutta":            { bg:'#fff3e0', color:'#e65100' },
    "🧀 Latticini":         { bg:'#fffde7', color:'#f9a825' },
    "🍝 Pasta & Cereali":   { bg:'#fce4ec', color:'#880e4f' },
    "🍞 Pane & Bakery":     { bg:'#efebe9', color:'#4e342e' },
    "🫒 Condimenti & Oli":  { bg:'#f1f8e9', color:'#558b2f' },
    "🍪 Snack & Dolci":     { bg:'#fff8e1', color:'#ff8f00' },
    "🥂 Vini & Bollicine":  { bg:'#f3e5f5', color:'#6a1b9a' },
    "🍺 Birra & Bevande":   { bg:'#e8eaf6', color:'#283593' },
    "🧴 Igiene Personale":  { bg:'#e0f7fa', color:'#00695c' },
    "🧹 Pulizia Casa":      { bg:'#e8eaf6', color:'#37474f' },
    "🍼 Neonati & Bambini": { bg:'#fce4ec', color:'#c2185b' },
    "🐾 Animali":           { bg:'#fff9c4', color:'#827717' },
    "💊 Farmacia":          { bg:'#e8f5e9', color:'#1b5e20' },
    "❓ Altro":             { bg:'#f5f5f5', color:'#616161' },
  };

  const today = new Date();
  document.getElementById('today-date').textContent =
    today.toLocaleDateString('it-IT', { day:'numeric', month:'long', year:'numeric' });

  db.ref('.info/connected').on('value', snap => {
    const dot   = document.getElementById('sync-dot');
    const label = document.getElementById('sync-label');
    if (snap.val()) {
      dot.className     = 'sync-dot connected';
      label.textContent = '🟢 Sincronizzato in tempo reale';
    } else {
      dot.className     = 'sync-dot error';
      label.textContent = '🔴 Offline — riconnessione...';
    }
  });

  itemsRef.on('value', snap => {
    items = snap.val() || {};
    render();
  });

  function render() {
    const ul = document.getElementById('shopping-list');
    ul.innerHTML = '';
    const entries = Object.entries(items);
    const visible = entries.filter(([k, it]) =>
      activeFilter === 'tutti' || it.category === activeFilter
    );
    document.getElementById('empty-msg').style.display = visible.length === 0 ? 'block' : 'none';

    visible.forEach(([key, item]) => {
      const li  = document.createElement('li');
      if (item.checked) li.classList.add('checked');
      const cat = catColors[item.category] || { bg:'#f5f5f5', color:'#666' };
      li.innerHTML = `
        <div class="checkbox"></div>
        <div class="item-info">
          <div class="item-name">${escHtml(item.name)}</div>
          ${item.brand ? `<div class="item-brand">${escHtml(item.brand)}</div>` : ''}
        </div>
        ${item.category ? `<span class="category-badge"
          style="background:${cat.bg};color:${cat.color}">${item.category}</span>` : ''}
        <span class="item-price">${item.price > 0 ? '€ ' + Number(item.price).toFixed(2).replace('.',',') : '—'}</span>
        <button class="delete-btn" title="Rimuovi" onclick="removeItem(event,'${key}')">✕</button>
      `;
      li.addEventListener('click', () => toggleCheck(key, item));
      ul.appendChild(li);
    });

    updateProgress();
    updateTotal();
    renderFilters();
  }

  function escHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function toggleCheck(key, item) {
    itemsRef.child(key).update({ checked: !item.checked });
  }

  function removeItem(e, key) {
    e.stopPropagation();
    itemsRef.child(key).remove();
    showToast('Articolo rimosso');
  }

  function clearChecked() {
    const toRemove = Object.entries(items).filter(([k, it]) => it.checked);
    if (toRemove.length === 0) { showToast('Nessun articolo spuntato'); return; }
    const updates = {};
    toRemove.forEach(([k]) => updates[k] = null);
    itemsRef.update(updates);
    showToast(`${toRemove.length} articolo/i rimosso/i`);
  }

  function addItem() {
    const name  = document.getElementById('new-name').value.trim();
    const brand = document.getElementById('new-brand').value.trim();
    const price = parseFloat(document.getElementById('new-price').value) || 0;
    const cat   = document.getElementById('new-category').value;

    if (!name) {
      const inp = document.getElementById('new-name');
      inp.focus(); inp.style.borderColor = '#e53935';
      setTimeout(() => inp.style.borderColor = '#ddd', 1500);
      return;
    }

    const btn = document.getElementById('add-btn');
    btn.disabled = true;

    itemsRef.push({ name, brand, price, category: cat, checked: false })
      .then(() => {
        document.getElementById('new-name').value     = '';
        document.getElementById('new-brand').value    = '';
        document.getElementById('new-price').value    = '';
        document.getElementById('new-category').value = '';
        showToast('✅ Articolo aggiunto!');
      })
      .catch(() => showToast('❌ Errore — riprova'))
      .finally(() => btn.disabled = false);
  }

  document.addEventListener('keydown', e => {
    if (e.key === 'Enter' && document.activeElement.closest('.add-form')) addItem();
  });

  function renderFilters() {
    const entries  = Object.values(items);
    const used     = [...new Set(entries.map(i => i.category).filter(Boolean))].sort();
    const container = document.getElementById('filters');
    container.innerHTML = `<button class="filter-btn ${activeFilter==='tutti'?'active':''}"
      onclick="filterBy('tutti',this)">🏷️ Tutti (${entries.length})</button>`;
    used.forEach(cat => {
      const count = entries.filter(i => i.category === cat).length;
      const btn   = document.createElement('button');
      btn.className   = 'filter-btn' + (activeFilter === cat ? ' active' : '');
      btn.textContent = `${cat} (${count})`;
      btn.onclick = function() { filterBy(cat, this); };
      container.appendChild(btn);
    });
  }

  function filterBy(cat, btn) {
    activeFilter = cat;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    render();
  }

  function updateProgress() {
    const all     = Object.values(items);
    const visible = all.filter(it => activeFilter === 'tutti' || it.category === activeFilter);
    const total   = visible.length;
    const checked = visible.filter(it => it.checked).length;
    const pct     = total > 0 ? Math.round((checked / total) * 100) : 0;
    document.getElementById('progress-text').textContent = `${checked} / ${total} articoli`;
    document.getElementById('progress-pct').textContent  = `${pct}%`;
    document.getElementById('progress-fill').style.width = pct + '%';
  }

  function updateTotal() {
    const total = Object.values(items).reduce((s, it) => s + Number(it.price || 0), 0);
    document.getElementById('total-price').textContent =
      '€ ' + total.toFixed(2).replace('.', ',');
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2500);
  }
</script>
</body>
</html>
