<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>🎮 Giochi — Scamonzio</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; overflow-x: hidden; }
    body { font-family: 'Segoe UI', sans-serif; background: #fff8f0; min-height: 100vh; }

    .header {
      background: linear-gradient(160deg, #b5451b 0%, #e8621a 50%, #f4a261 100%);
      color: white; padding: 52px 20px 36px; text-align: center; position: relative; overflow: hidden;
    }
    .header::before {
      content: ''; position: absolute; inset: 0;
      background: radial-gradient(ellipse 60% 40% at 20% 30%, rgba(255,255,255,0.10), transparent),
                  radial-gradient(ellipse 50% 35% at 80% 70%, rgba(255,255,255,0.07), transparent);
    }
    .home-btn {
      position: absolute; top: 14px; left: 14px; z-index: 10;
      background: rgba(255,255,255,0.85); color: #e8621a; border: none; border-radius: 20px;
      padding: 6px 14px; font-size: 0.82rem; font-weight: 700; cursor: pointer;
      text-decoration: none; display: inline-flex; align-items: center; gap: 5px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.12);
    }
    .header h1 { font-size: 2rem; font-weight: 900; text-shadow: 0 3px 12px rgba(0,0,0,0.25); position: relative; }
    .header .subtitle { font-size: 0.85rem; opacity: 0.90; margin-top: 8px; font-weight: 500; position: relative; }
    .particles { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
    .particle { position: absolute; border-radius: 50%; background: rgba(255,255,255,0.18); animation: floatUp linear infinite; }
    .particle:nth-child(1) { width:8px; height:8px; left:10%; bottom:0; animation-duration:6s; animation-delay:0s; }
    .particle:nth-child(2) { width:5px; height:5px; left:25%; bottom:0; animation-duration:4.5s; animation-delay:1s; }
    .particle:nth-child(3) { width:10px; height:10px; left:42%; bottom:0; animation-duration:7s; animation-delay:2s; }
    .particle:nth-child(4) { width:6px; height:6px; left:60%; bottom:0; animation-duration:5s; animation-delay:0.5s; }
    .particle:nth-child(5) { width:12px; height:12px; left:75%; bottom:0; animation-duration:8s; animation-delay:1.5s; }
    .particle:nth-child(6) { width:4px; height:4px; left:88%; bottom:0; animation-duration:4s; animation-delay:3s; }
    @keyframes floatUp { 0%{transform:translateY(0) scale(1);opacity:0.8;} 100%{transform:translateY(-120px) scale(0.5);opacity:0;} }

    .wave-divider { display:block; line-height:0; overflow:hidden; background:linear-gradient(160deg,#b5451b 0%,#e8621a 50%,#f4a261 100%); }
    .wave-divider svg { display:block; width:100%; }

    .container { max-width: 540px; margin: 0 auto; padding: 18px 14px 64px; }

    /* TABS */
    .game-tabs { display:flex; gap:0; margin-bottom:18px; background:white; border-radius:14px; padding:4px; box-shadow:0 2px 10px rgba(180,80,20,0.08); border:2px solid #fbd5b5; }
    .tab-btn { flex:1; border:none; border-radius:10px; padding:10px 8px; font-size:0.85rem; font-weight:700; cursor:pointer; background:transparent; color:#bf4a1a; transition:all 0.2s; }
    .tab-btn.active { background:linear-gradient(135deg,#e8621a,#f4a261); color:white; }

    /* GAME PANELS */
    .game-panel { display:none; }
    .game-panel.active { display:block; }

    /* ──────────── SUDOKU ──────────── */
    .sudoku-controls { display:flex; align-items:center; gap:8px; margin-bottom:12px; flex-wrap:wrap; }
    .sudoku-controls select, .sudoku-controls button {
      border:1.5px solid #fbd5b5; border-radius:10px; padding:7px 12px; font-size:0.82rem; font-weight:700;
      cursor:pointer; background:white; color:#bf4a1a; outline:none;
    }
    .sudoku-controls button { transition:all 0.2s; }
    .sudoku-controls button:hover { background:#fff3e8; }
    .sudoku-controls .btn-primary { background:linear-gradient(135deg,#e8621a,#f4a261); color:white; border:none; }
    .timer-display { font-size:1rem; font-weight:800; color:#e8621a; margin-left:auto; }

    .sudoku-wrap {
      background:white; border-radius:14px; padding:10px; box-shadow:0 3px 16px rgba(180,80,20,0.08);
      border:2px solid #fbd5b5; margin-bottom:12px; overflow:hidden;
    }
    .sudoku-grid {
      display:grid; grid-template-columns:repeat(9,1fr); width:100%;
      border:2.5px solid #bf4a1a; border-radius:4px; overflow:hidden;
    }
    .sudoku-cell {
      aspect-ratio:1; border:0.5px solid #fbd5b5; display:flex; align-items:center; justify-content:center;
      font-size:clamp(0.75rem,2.5vw,1.1rem); font-weight:700; cursor:pointer; transition:background 0.15s; position:relative;
      color:#333; user-select:none;
    }
    .sudoku-cell.given { color:#1565c0; background:#f0f5ff; cursor:default; }
    .sudoku-cell.selected { background:#fff3e8; outline:2px solid #e8621a; outline-offset:-2px; z-index:1; }
    .sudoku-cell.error { color:#dc2626; background:#fee2e2; }
    .sudoku-cell.highlight { background:#fef9f5; }
    /* Thick borders for 3×3 boxes */
    .sudoku-cell:nth-child(3n) { border-right:2px solid #bf4a1a; }
    .sudoku-cell:nth-child(9n) { border-right:none; }
    .sudoku-row-3 .sudoku-cell, .sudoku-row-6 .sudoku-cell { border-bottom:2px solid #bf4a1a; }

    .numpad { display:grid; grid-template-columns:repeat(5,1fr); gap:6px; margin-bottom:12px; }
    .numpad-btn {
      border:2px solid #fbd5b5; border-radius:10px; padding:10px 4px; font-size:1rem; font-weight:800;
      cursor:pointer; background:white; color:#bf4a1a; transition:all 0.15s; text-align:center;
    }
    .numpad-btn:hover, .numpad-btn:active { background:#fff3e8; border-color:#e8621a; }
    .numpad-btn.erase { font-size:0.8rem; }

    .scores-bar { background:white; border-radius:12px; padding:10px 14px; border:2px solid #fbd5b5; font-size:0.8rem; color:#888; }
    .score-item { display:inline-flex; align-items:center; gap:6px; margin-right:12px; }
    .score-val { font-weight:800; color:#e8621a; }

    /* ──────────── QUIZ ──────────── */
    .quiz-card { background:white; border-radius:18px; padding:20px; box-shadow:0 3px 16px rgba(180,80,20,0.08); border:2px solid #fbd5b5; }
    .quiz-progress { display:flex; justify-content:space-between; font-size:0.78rem; color:#aaa; margin-bottom:10px; }
    .quiz-progress-bar { height:6px; background:#fde8d8; border-radius:10px; overflow:hidden; margin-bottom:16px; }
    .quiz-progress-fill { height:100%; background:linear-gradient(90deg,#e8621a,#f4a261); border-radius:10px; transition:width 0.4s ease; }
    .quiz-question { font-size:0.95rem; font-weight:700; color:#333; line-height:1.5; margin-bottom:16px; }
    .quiz-options { display:flex; flex-direction:column; gap:8px; margin-bottom:16px; }
    .quiz-option {
      border:2px solid #fbd5b5; border-radius:12px; padding:12px 14px; font-size:0.87rem; font-weight:600;
      cursor:pointer; background:white; color:#333; text-align:left; transition:all 0.2s;
    }
    .quiz-option:hover:not(:disabled) { background:#fff3e8; border-color:#e8621a; }
    .quiz-option.correct   { background:#dcfce7; border-color:#16a34a; color:#15803d; pointer-events:none; }
    .quiz-option.wrong     { background:#fee2e2; border-color:#dc2626; color:#b91c1c; pointer-events:none; }
    .quiz-option.reveal    { background:#dcfce7; border-color:#16a34a; color:#15803d; pointer-events:none; }
    .quiz-option:disabled  { pointer-events:none; opacity:0.7; }
    .quiz-feedback { font-size:0.85rem; font-weight:700; margin-bottom:12px; min-height:22px; }
    .quiz-feedback.ok  { color:#16a34a; }
    .quiz-feedback.bad { color:#dc2626; }
    .quiz-next { width:100%; background:linear-gradient(135deg,#e8621a,#f4a261); color:white; border:none; border-radius:12px; padding:12px; font-size:0.9rem; font-weight:700; cursor:pointer; display:none; }
    .quiz-result { text-align:center; padding:20px 0; display:none; }
    .quiz-result .score-big { font-size:2.5rem; font-weight:900; color:#e8621a; }
    .quiz-result .score-label { font-size:1rem; color:#666; margin-top:4px; margin-bottom:8px; }
    .quiz-result .comment { font-size:0.9rem; color:#888; margin-bottom:16px; line-height:1.6; }
    .quiz-restart { background:linear-gradient(135deg,#e8621a,#f4a261); color:white; border:none; border-radius:12px; padding:12px 28px; font-size:0.9rem; font-weight:700; cursor:pointer; }

    .page-footer { text-align:center; font-size:0.7rem; color:#d4a88a; padding:8px 0 24px; letter-spacing:0.3px; }
    .toast {
      position:fixed; bottom:20px; left:50%; transform:translateX(-50%) translateY(80px);
      background:#323232; color:#fff; padding:10px 20px; border-radius:20px; font-size:0.83rem;
      font-weight:500; transition:transform 0.3s ease; z-index:999; white-space:nowrap; max-width:calc(100vw - 32px);
    }
    .toast.show { transform:translateX(-50%) translateY(0); }
  </style>
</head>
<body>

<div class="header">
  <div class="particles">
    <div class="particle"></div><div class="particle"></div><div class="particle"></div>
    <div class="particle"></div><div class="particle"></div><div class="particle"></div>
  </div>
  <a class="home-btn" href="home.html">← Home</a>
  <h1>🎮 Giochi</h1>
  <div class="subtitle">Sudoku e Quiz di Famiglia</div>
</div>

<div class="wave-divider">
  <svg viewBox="0 0 1440 72" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M0,36 C180,72 360,0 540,36 C720,72 900,0 1080,36 C1260,72 1380,12 1440,36 L1440,72 L0,72 Z" fill="#fff8f0"/>
    <path d="M0,50 C220,18 440,66 660,46 C880,26 1100,62 1320,44 L1440,50 L1440,72 L0,72 Z" fill="#fff8f0" opacity="0.55"/>
  </svg>
</div>

<div class="container">
  <div class="game-tabs">
    <button class="tab-btn active" onclick="showTab('sudoku',this)">🔢 Sudoku</button>
    <button class="tab-btn" onclick="showTab('quiz',this)">❓ Quiz Famiglia</button>
  </div>

  <!-- ════════ SUDOKU ════════ -->
  <div class="game-panel active" id="panel-sudoku">
    <div class="sudoku-controls">
      <select id="diff-select">
        <option value="easy">😊 Facile</option>
        <option value="medium" selected>🧩 Medio</option>
        <option value="hard">🔥 Difficile</option>
      </select>
      <button class="btn-primary" onclick="newGame()">🔄 Nuova partita</button>
      <button onclick="showSolution()">💡 Soluzione</button>
      <span class="timer-display" id="timer">00:00</span>
    </div>
    <div class="sudoku-wrap">
      <div class="sudoku-grid" id="sudoku-grid"></div>
    </div>
    <div class="numpad" id="numpad"></div>
    <div class="scores-bar" id="scores-bar">
      <span class="score-item">🏆 Record Facile: <span class="score-val" id="rec-easy">—</span></span>
      <span class="score-item">🏆 Record Medio: <span class="score-val" id="rec-medium">—</span></span>
      <span class="score-item">🏆 Record Difficile: <span class="score-val" id="rec-hard">—</span></span>
    </div>
  </div>

  <!-- ════════ QUIZ ════════ -->
  <div class="game-panel" id="panel-quiz">
    <div class="quiz-card">
      <div id="quiz-game">
        <div class="quiz-progress">
          <span id="q-num">Domanda 1 / 10</span>
          <span id="q-score">Punteggio: 0</span>
        </div>
        <div class="quiz-progress-bar"><div class="quiz-progress-fill" id="q-fill" style="width:0%"></div></div>
        <div class="quiz-question" id="q-text"></div>
        <div class="quiz-options" id="q-options"></div>
        <div class="quiz-feedback" id="q-feedback"></div>
        <button class="quiz-next" id="q-next" onclick="nextQuestion()">Prossima domanda →</button>
      </div>
      <div class="quiz-result" id="quiz-result">
        <div class="score-big" id="res-score"></div>
        <div class="score-label">su 10 domande</div>
        <div class="comment" id="res-comment"></div>
        <button class="quiz-restart" onclick="startQuiz()">🔄 Gioca ancora</button>
      </div>
    </div>
  </div>
</div>

<div class="page-footer">🏠 Scamonzio &nbsp;•&nbsp; Giochi</div>
<div class="toast" id="toast"></div>

<script>
// ═══════════════════════════════════════════════════
//  TABS
// ═══════════════════════════════════════════════════
function showTab(id, btn) {
  document.querySelectorAll('.game-panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('panel-' + id).classList.add('active');
  btn.classList.add('active');
}

// ═══════════════════════════════════════════════════
//  SUDOKU
// ═══════════════════════════════════════════════════
let sudokuPuzzle  = [];
let sudokuSolution = [];
let sudokuPlayer  = [];
let selectedCell  = null;
let timerInterval = null;
let timerSeconds  = 0;
let gameOver      = false;

const PUZZLES = {
  easy: [
    [5,3,0,0,7,0,0,0,0],
    [6,0,0,1,9,5,0,0,0],
    [0,9,8,0,0,0,0,6,0],
    [8,0,0,0,6,0,0,0,3],
    [4,0,0,8,0,3,0,0,1],
    [7,0,0,0,2,0,0,0,6],
    [0,6,0,0,0,0,2,8,0],
    [0,0,0,4,1,9,0,0,5],
    [0,0,0,0,8,0,0,7,9]
  ],
  medium: [
    [0,2,0,6,0,8,0,0,0],
    [5,8,0,0,0,9,7,0,0],
    [0,0,0,0,4,0,0,0,0],
    [3,7,0,0,0,0,5,0,0],
    [6,0,0,0,0,0,0,0,4],
    [0,0,8,0,0,0,0,1,3],
    [0,0,0,0,2,0,0,0,0],
    [0,0,9,8,0,0,0,3,6],
    [0,0,0,3,0,6,0,9,0]
  ],
  hard: [
    [0,0,0,2,6,0,7,0,1],
    [6,8,0,0,7,0,0,9,0],
    [1,9,0,0,0,4,5,0,0],
    [8,2,0,1,0,0,0,4,0],
    [0,0,4,6,0,2,9,0,0],
    [0,5,0,0,0,3,0,2,8],
    [0,0,9,3,0,0,0,7,4],
    [0,4,0,0,5,0,0,3,6],
    [7,0,3,0,1,8,0,0,0]
  ]
};

const SOLUTIONS = {
  easy: [
    [5,3,4,6,7,8,9,1,2],
    [6,7,2,1,9,5,3,4,8],
    [1,9,8,3,4,2,5,6,7],
    [8,5,9,7,6,1,4,2,3],
    [4,2,6,8,5,3,7,9,1],
    [7,1,3,9,2,4,8,5,6],
    [9,6,1,5,3,7,2,8,4],
    [2,8,7,4,1,9,6,3,5],
    [3,4,5,2,8,6,1,7,9]
  ],
  medium: [
    [1,2,3,6,7,8,9,4,5],
    [5,8,4,2,3,9,7,6,1],
    [9,6,7,1,4,5,3,2,8],
    [3,7,2,4,6,1,5,8,9],
    [6,9,1,5,8,3,2,7,4],
    [4,5,8,7,9,2,6,1,3],
    [8,3,6,9,2,4,1,5,7],
    [2,1,9,8,5,7,4,3,6],
    [7,4,5,3,1,6,8,9,2]
  ],
  hard: [
    [4,3,5,2,6,9,7,8,1],
    [6,8,2,5,7,1,4,9,3],
    [1,9,7,8,3,4,5,6,2],
    [8,2,6,1,9,5,3,4,7],
    [3,7,4,6,8,2,9,1,5],
    [9,5,1,7,4,3,6,2,8],
    [5,1,9,3,2,6,8,7,4],
    [2,4,8,9,5,7,1,3,6],
    [7,6,3,4,1,8,2,5,9]
  ]
};

function newGame() {
  const diff = document.getElementById('diff-select').value;
  sudokuPuzzle   = PUZZLES[diff].map(r => [...r]);
  sudokuSolution = SOLUTIONS[diff].map(r => [...r]);
  sudokuPlayer   = sudokuPuzzle.map(r => [...r]);
  selectedCell   = null;
  gameOver       = false;
  resetTimer();
  startTimer();
  renderGrid();
  buildNumpad();
}

function renderGrid() {
  const grid = document.getElementById('sudoku-grid');
  grid.innerHTML = '';
  for (let r = 0; r < 9; r++) {
    for (let c = 0; c < 9; c++) {
      const cell = document.createElement('div');
      cell.className = 'sudoku-cell';
      if (r === 2 || r === 5) cell.style.borderBottom = '2.5px solid #bf4a1a';
      if (c === 2 || c === 5) cell.style.borderRight  = '2.5px solid #bf4a1a';
      const given = sudokuPuzzle[r][c] !== 0;
      if (given) { cell.classList.add('given'); cell.textContent = sudokuPuzzle[r][c]; }
      else if (sudokuPlayer[r][c] !== 0) {
        cell.textContent = sudokuPlayer[r][c];
        if (!isValidEntry(r, c, sudokuPlayer[r][c])) cell.classList.add('error');
      }
      if (selectedCell && selectedCell[0] === r && selectedCell[1] === c) cell.classList.add('selected');
      else if (selectedCell && (selectedCell[0] === r || selectedCell[1] === c || (Math.floor(r/3) === Math.floor(selectedCell[0]/3) && Math.floor(c/3) === Math.floor(selectedCell[1]/3)))) cell.classList.add('highlight');
      cell.dataset.r = r; cell.dataset.c = c;
      cell.addEventListener('click', () => selectCell(r, c));
      grid.appendChild(cell);
    }
  }
}

function selectCell(r, c) {
  if (gameOver) return;
  if (sudokuPuzzle[r][c] !== 0) { selectedCell = null; renderGrid(); return; }
  selectedCell = [r, c];
  renderGrid();
}

function buildNumpad() {
  const pad = document.getElementById('numpad');
  pad.innerHTML = '';
  for (let n = 1; n <= 9; n++) {
    const btn = document.createElement('button');
    btn.className = 'numpad-btn';
    btn.textContent = n;
    btn.addEventListener('click', () => enterNum(n));
    pad.appendChild(btn);
  }
  const erase = document.createElement('button');
  erase.className = 'numpad-btn erase';
  erase.textContent = '⌫ Cancella';
  erase.addEventListener('click', () => enterNum(0));
  pad.appendChild(erase);
}

function enterNum(n) {
  if (!selectedCell || gameOver) return;
  const [r, c] = selectedCell;
  if (sudokuPuzzle[r][c] !== 0) return;
  sudokuPlayer[r][c] = n;
  renderGrid();
  checkComplete();
}

document.addEventListener('keydown', e => {
  if (!selectedCell || gameOver) return;
  const n = parseInt(e.key);
  if (n >= 1 && n <= 9) { enterNum(n); return; }
  if (e.key === 'Backspace' || e.key === 'Delete') { enterNum(0); return; }
  const [r, c] = selectedCell;
  if (e.key === 'ArrowUp'    && r > 0) { selectedCell = [r-1, c]; renderGrid(); }
  if (e.key === 'ArrowDown'  && r < 8) { selectedCell = [r+1, c]; renderGrid(); }
  if (e.key === 'ArrowLeft'  && c > 0) { selectedCell = [r, c-1]; renderGrid(); }
  if (e.key === 'ArrowRight' && c < 8) { selectedCell = [r, c+1]; renderGrid(); }
});

function isValidEntry(r, c, num) {
  if (num === 0) return true;
  for (let i = 0; i < 9; i++) {
    if (i !== c && sudokuPlayer[r][i] === num) return false;
    if (i !== r && sudokuPlayer[i][c] === num) return false;
  }
  const boxR = Math.floor(r/3)*3, boxC = Math.floor(c/3)*3;
  for (let i = boxR; i < boxR+3; i++) for (let j = boxC; j < boxC+3; j++) {
    if ((i !== r || j !== c) && sudokuPlayer[i][j] === num) return false;
  }
  return true;
}

function checkComplete() {
  for (let r = 0; r < 9; r++) for (let c = 0; c < 9; c++) {
    if (sudokuPlayer[r][c] !== sudokuSolution[r][c]) return;
  }
  gameOver = true;
  clearInterval(timerInterval);
  const diff = document.getElementById('diff-select').value;
  saveRecord(diff, timerSeconds);
  showToast('🎉 Completato in ' + formatTime(timerSeconds) + '!');
}

function showSolution() {
  sudokuPlayer = sudokuSolution.map(r => [...r]);
  gameOver = true;
  clearInterval(timerInterval);
  renderGrid();
  showToast('💡 Soluzione mostrata');
}

function startTimer() {
  timerSeconds = 0;
  timerInterval = setInterval(() => {
    timerSeconds++;
    document.getElementById('timer').textContent = formatTime(timerSeconds);
  }, 1000);
}
function resetTimer() {
  clearInterval(timerInterval);
  timerSeconds = 0;
  document.getElementById('timer').textContent = '00:00';
}
function formatTime(s) {
  return String(Math.floor(s/60)).padStart(2,'0') + ':' + String(s%60).padStart(2,'0');
}

function saveRecord(diff, secs) {
  const key = 'sudoku_record_' + diff;
  const prev = localStorage.getItem(key);
  if (!prev || secs < parseInt(prev)) {
    localStorage.setItem(key, secs);
    updateRecords();
  }
}
function updateRecords() {
  ['easy','medium','hard'].forEach(d => {
    const v = localStorage.getItem('sudoku_record_' + d);
    document.getElementById('rec-' + d).textContent = v ? formatTime(parseInt(v)) : '—';
  });
}

// ═══════════════════════════════════════════════════
//  QUIZ
// ═══════════════════════════════════════════════════
const ALL_QUESTIONS = [
  { q:'In quale anno si è svolta la prima Olimpiade moderna?', opts:['1896','1900','1880','1912'], a:0 },
  { q:'Quanti giocatori ci sono in una squadra di pallanuoto in acqua?', opts:['6','7','8','5'], a:1 },
  { q:'Qual è la capitale della Sardegna?', opts:['Cagliari','Sassari','Nuoro','Oristano'], a:0 },
  { q:'Quanti punti vale una schiacciata da tre in basket?', opts:['2','3','1','4'], a:1 },
  { q:'Quale fiume attraversa Torino?', opts:['Po','Tevere','Arno','Adige'], a:0 },
  { q:'In pallanuoto, quanti set vengono giocati in una partita ufficiale?', opts:['4 tempi','3 set','2 tempi','4 quarti'], a:3 },
  { q:'In quale regione italiana si trova il lago di Garda?', opts:['Tra Veneto, Lombardia e Trentino','Solo in Lombardia','Solo in Veneto','In Piemonte'], a:0 },
  { q:'Quanti anelli ha il simbolo olimpico?', opts:['4','5','6','7'], a:1 },
  { q:'Qual è la durata regolamentare di un quarto di basket NBA?', opts:['10 minuti','12 minuti','15 minuti','8 minuti'], a:1 },
  { q:'Qual è la vetta più alta delle Alpi?', opts:['Monte Bianco','Monte Rosa','Matterhorn','Gran Paradiso'], a:0 },
  { q:'In quale città italiana si trova la Torre degli Asinelli?', opts:['Bologna','Pisa','Firenze','Modena'], a:0 },
  { q:'Quanti centimetri misura il canestro di basket in altezza dal suolo?', opts:['3,05 m','3,25 m','2,90 m','3,00 m'], a:0 },
  { q:'Qual è la profondità minima di una piscina per la pallanuoto?', opts:['1,5 m','1,8 m','2,0 m','1,0 m'], a:1 },
  { q:'Quante regioni ha l\'Italia?', opts:['18','20','21','19'], a:1 },
  { q:'Quale squadra ha vinto più volte il campionato italiano di basket?', opts:['Olimpia Milano','Virtus Bologna','Fortitudo Bologna','Cantù'], a:0 },
];

let quizQuestions = [];
let quizIndex = 0;
let quizScore = 0;
let answered  = false;

function startQuiz() {
  quizQuestions = shuffle([...ALL_QUESTIONS]).slice(0, 10);
  quizIndex = 0;
  quizScore = 0;
  answered  = false;
  document.getElementById('quiz-result').style.display = 'none';
  document.getElementById('quiz-game').style.display   = 'block';
  showQuestion();
}

function showQuestion() {
  answered = false;
  const q = quizQuestions[quizIndex];
  document.getElementById('q-num').textContent  = `Domanda ${quizIndex+1} / ${quizQuestions.length}`;
  document.getElementById('q-score').textContent = `Punteggio: ${quizScore}`;
  document.getElementById('q-fill').style.width  = `${(quizIndex / quizQuestions.length) * 100}%`;
  document.getElementById('q-text').textContent  = q.q;
  document.getElementById('q-feedback').textContent = '';
  document.getElementById('q-feedback').className = 'quiz-feedback';
  document.getElementById('q-next').style.display = 'none';

  const opts = document.getElementById('q-options');
  opts.innerHTML = '';
  const shuffled = shuffle(q.opts.map((o, i) => ({ text: o, correct: i === q.a })));
  shuffled.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'quiz-option';
    btn.textContent = opt.text;
    btn.addEventListener('click', () => {
      if (answered) return;
      answered = true;
      opts.querySelectorAll('.quiz-option').forEach(b => b.disabled = true);
      if (opt.correct) {
        btn.classList.add('correct');
        document.getElementById('q-feedback').textContent = '✅ Corretto!';
        document.getElementById('q-feedback').className = 'quiz-feedback ok';
        quizScore++;
      } else {
        btn.classList.add('wrong');
        document.getElementById('q-feedback').textContent = '❌ Sbagliato!';
        document.getElementById('q-feedback').className = 'quiz-feedback bad';
        opts.querySelectorAll('.quiz-option').forEach(b => { if (shuffled[Array.from(opts.children).indexOf(b)]?.correct) b.classList.add('reveal'); });
      }
      document.getElementById('q-next').style.display = 'block';
      document.getElementById('q-score').textContent = `Punteggio: ${quizScore}`;
    });
    opts.appendChild(btn);
  });
}

function nextQuestion() {
  quizIndex++;
  if (quizIndex >= quizQuestions.length) {
    showResult();
  } else {
    showQuestion();
  }
}

function showResult() {
  document.getElementById('quiz-game').style.display   = 'none';
  document.getElementById('quiz-result').style.display = 'block';
  document.getElementById('res-score').textContent     = `${quizScore} / 10`;
  const comments = [
    [0, 3,  '😅 Ci vuole un po\' di allenamento! Riprova!'],
    [4, 6,  '🙂 Non male! Con un po\' di studio puoi fare meglio.'],
    [7, 8,  '😊 Bravo/a! Conosci bene sport e geografia.'],
    [9, 10, '🏆 Eccellente! Sei un campione/essa di famiglia!']
  ];
  const c = comments.find(([min, max]) => quizScore >= min && quizScore <= max);
  document.getElementById('res-comment').textContent = c ? c[2] : '';
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

// Init
updateRecords();
newGame();
startQuiz();
</script>
