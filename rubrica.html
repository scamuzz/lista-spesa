<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>📞 Rubrica — Scamonzio</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; overflow-x: hidden; }
    body { font-family: 'Segoe UI', sans-serif; background: #fff8f0; min-height: 100vh; }

    .header {
      background: linear-gradient(160deg, #b5451b 0%, #e8621a 50%, #f4a261 100%);
      color: white; padding: 52px 20px 36px; text-align: center; position: relative; overflow: hidden;
    }
    .header::before {
      content: ''; position: absolute; inset: 0;
      background: radial-gradient(ellipse 60% 40% at 20% 30%, rgba(255,255,255,0.10), transparent),
                  radial-gradient(ellipse 50% 35% at 80% 70%, rgba(255,255,255,0.07), transparent);
    }
    .home-btn {
      position: absolute; top: 14px; left: 14px; z-index: 10;
      background: rgba(255,255,255,0.85); color: #e8621a; border: none; border-radius: 20px;
      padding: 6px 14px; font-size: 0.82rem; font-weight: 700; cursor: pointer;
      text-decoration: none; display: inline-flex; align-items: center; gap: 5px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.12);
    }
    .header h1 { font-size: 2rem; font-weight: 900; text-shadow: 0 3px 12px rgba(0,0,0,0.25); position: relative; }
    .header .subtitle { font-size: 0.85rem; opacity: 0.90; margin-top: 8px; font-weight: 500; position: relative; }
    .particles { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
    .particle { position: absolute; border-radius: 50%; background: rgba(255,255,255,0.18); animation: floatUp linear infinite; }
    .particle:nth-child(1) { width:8px; height:8px; left:10%; bottom:0; animation-duration:6s; animation-delay:0s; }
    .particle:nth-child(2) { width:5px; height:5px; left:25%; bottom:0; animation-duration:4.5s; animation-delay:1s; }
    .particle:nth-child(3) { width:10px; height:10px; left:42%; bottom:0; animation-duration:7s; animation-delay:2s; }
    .particle:nth-child(4) { width:6px; height:6px; left:60%; bottom:0; animation-duration:5s; animation-delay:0.5s; }
    .particle:nth-child(5) { width:12px; height:12px; left:75%; bottom:0; animation-duration:8s; animation-delay:1.5s; }
    .particle:nth-child(6) { width:4px; height:4px; left:88%; bottom:0; animation-duration:4s; animation-delay:3s; }
    @keyframes floatUp { 0%{transform:translateY(0) scale(1);opacity:0.8;} 100%{transform:translateY(-120px) scale(0.5);opacity:0;} }

    .sync-status { display:flex; align-items:center; justify-content:center; gap:6px; font-size:0.72rem; margin-top:8px; opacity:0.9; position:relative; }
    .sync-dot { width:8px; height:8px; border-radius:50%; background:#fff; animation:pulse 1.5s infinite; flex-shrink:0; }
    .sync-dot.connected { background:#a5d6a7; animation:none; }
    .sync-dot.error { background:#ef9a9a; animation:none; }
    @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.3;} }

    .wave-divider { display:block; line-height:0; overflow:hidden; background:linear-gradient(160deg,#b5451b 0%,#e8621a 50%,#f4a261 100%); }
    .wave-divider svg { display:block; width:100%; }

    .container { max-width: 540px; margin: 0 auto; padding: 18px 14px 64px; }

    /* SEARCH + FILTER */
    .search-bar {
      width:100%; border:1.5px solid #fbd5b5; border-radius:12px; padding:10px 14px;
      font-size:0.88rem; outline:none; background:#fff; color:#333; margin-bottom:10px;
    }
    .search-bar:focus { border-color:#e8621a; }
    .cat-filters { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:14px; }
    .cf-btn { border:none; border-radius:20px; padding:5px 12px; font-size:0.74rem; font-weight:700; cursor:pointer; background:#fde8d8; color:#bf4a1a; transition:all 0.2s; }
    .cf-btn.active, .cf-btn:hover { background:#e8621a; color:#fff; }

    /* CONTACT LIST */
    .contact-list { display:flex; flex-direction:column; gap:8px; margin-bottom:14px; }
    .contact-item {
      background:white; border-radius:14px; padding:12px 14px; box-shadow:0 2px 10px rgba(180,80,20,0.07);
      border:2px solid #fde8d8; display:flex; align-items:center; gap:12px;
    }
    .contact-avatar {
      width:42px; height:42px; border-radius:50%; display:flex; align-items:center; justify-content:center;
      font-size:1.3rem; flex-shrink:0;
    }
    .contact-body { flex:1; min-width:0; }
    .contact-name { font-size:0.9rem; font-weight:700; color:#333; }
    .contact-rel { margin-top:2px; }
    .cat-badge { font-size:0.65rem; font-weight:800; border-radius:8px; padding:2px 7px; }
    .cat-Medico    { background:#dbeafe; color:#1565c0; }
    .cat-Scuola    { background:#f3e8ff; color:#6a1b9a; }
    .cat-Parente   { background:#dcfce7; color:#2e7d32; }
    .cat-Amico     { background:#fef9c3; color:#b45309; }
    .cat-Servizio  { background:#fff3e8; color:#e8621a; }
    .cat-Altro     { background:#f5f5f5; color:#666; }
    .contact-phone { font-size:0.8rem; color:#666; margin-top:3px; }
    .contact-note { font-size:0.73rem; color:#aaa; margin-top:2px; }
    .tel-link { color:#e8621a; font-weight:600; text-decoration:none; }
    .tel-link:hover { text-decoration:underline; }
    .contact-del { background:none; border:none; cursor:pointer; color:#ccc; font-size:0.9rem; flex-shrink:0; }
    .contact-del:hover { color:#e53935; }

    .empty-msg { text-align:center; padding:28px 0; color:#bbb; font-size:0.88rem; }
    .empty-msg .big { font-size:2rem; display:block; margin-bottom:6px; }

    /* ADD FORM */
    .add-card { background:white; border-radius:18px; padding:18px; box-shadow:0 3px 16px rgba(180,80,20,0.08); border:2px solid #fbd5b5; }
    .add-card h3 { font-size:0.82rem; font-weight:800; color:#bf4a1a; margin-bottom:12px; text-transform:uppercase; letter-spacing:0.5px; }
    .form-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    .form-grid input, .form-grid select {
      border:1.5px solid #fbd5b5; border-radius:10px; padding:9px 10px; font-size:0.82rem; outline:none;
      transition:border-color 0.2s; color:#333; background:#fafafa; width:100%; min-width:0;
    }
    .form-grid input:focus, .form-grid select:focus { border-color:#e8621a; background:#fff; }
    .form-grid .full { grid-column:1/-1; }
    .add-btn {
      grid-column:1/-1; background:linear-gradient(135deg,#e8621a,#f4a261); color:white; border:none;
      border-radius:10px; padding:12px; font-size:0.9rem; font-weight:700; cursor:pointer; transition:opacity 0.2s;
    }
    .add-btn:hover { opacity:0.88; }

    .page-footer { text-align:center; font-size:0.7rem; color:#d4a88a; padding:8px 0 24px; letter-spacing:0.3px; }
    .toast {
      position:fixed; bottom:20px; left:50%; transform:translateX(-50%) translateY(80px);
      background:#323232; color:#fff; padding:10px 20px; border-radius:20px; font-size:0.83rem;
      font-weight:500; transition:transform 0.3s ease; z-index:999; white-space:nowrap; max-width:calc(100vw - 32px);
    }
    .toast.show { transform:translateX(-50%) translateY(0); }
  </style>
</head>
<body>

<div class="header">
  <div class="particles">
    <div class="particle"></div><div class="particle"></div><div class="particle"></div>
    <div class="particle"></div><div class="particle"></div><div class="particle"></div>
  </div>
  <a class="home-btn" href="home.html">← Home</a>
  <h1>📞 Rubrica</h1>
  <div class="subtitle">Contatti importanti della famiglia</div>
  <div class="sync-status">
    <div class="sync-dot" id="sync-dot"></div>
    <span id="sync-label">Connessione in corso...</span>
  </div>
</div>

<div class="wave-divider">
  <svg viewBox="0 0 1440 72" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M0,36 C180,72 360,0 540,36 C720,72 900,0 1080,36 C1260,72 1380,12 1440,36 L1440,72 L0,72 Z" fill="#fff8f0"/>
    <path d="M0,50 C220,18 440,66 660,46 C880,26 1100,62 1320,44 L1440,50 L1440,72 L0,72 Z" fill="#fff8f0" opacity="0.55"/>
  </svg>
</div>

<div class="container">
  <input type="search" class="search-bar" id="search" placeholder="🔍 Cerca contatto..." oninput="render()"/>
  <div class="cat-filters">
    <button class="cf-btn active" data-c="tutti" onclick="setCat('tutti',this)">📋 Tutti</button>
    <button class="cf-btn" data-c="Medico"   onclick="setCat('Medico',this)">🏥 Medico</button>
    <button class="cf-btn" data-c="Scuola"   onclick="setCat('Scuola',this)">🎓 Scuola</button>
    <button class="cf-btn" data-c="Parente"  onclick="setCat('Parente',this)">👨‍👩‍👧 Parente</button>
    <button class="cf-btn" data-c="Amico"    onclick="setCat('Amico',this)">👤 Amico</button>
    <button class="cf-btn" data-c="Servizio" onclick="setCat('Servizio',this)">🔧 Servizio</button>
    <button class="cf-btn" data-c="Altro"    onclick="setCat('Altro',this)">📌 Altro</button>
  </div>

  <div class="contact-list" id="contact-list"></div>
  <div class="empty-msg" id="empty-msg" style="display:none;"><span class="big">📞</span>Nessun contatto trovato</div>

  <div class="add-card">
    <h3>➕ Nuovo contatto</h3>
    <div class="form-grid">
      <input type="text" id="c-name" placeholder="Nome *" class="full"/>
      <select id="c-cat">
        <option value="Medico">🏥 Medico</option>
        <option value="Scuola">🎓 Scuola</option>
        <option value="Parente">👨‍👩‍👧 Parente</option>
        <option value="Amico">👤 Amico</option>
        <option value="Servizio">🔧 Servizio</option>
        <option value="Altro">📌 Altro</option>
      </select>
      <input type="tel" id="c-phone" placeholder="Telefono"/>
      <input type="text" id="c-note" placeholder="Note (opz.)" class="full"/>
      <button class="add-btn" onclick="addContact()">➕ Aggiungi contatto</button>
    </div>
  </div>
</div>

<div class="page-footer">🏠 Scamonzio &nbsp;•&nbsp; Rubrica</div>
<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script>
  const firebaseConfig = {
    apiKey: "AIzaSyAfOMeAkXUIandLUhCR8nfyELOPVRyD3WU",
    authDomain: "lista-spesa-b9eb1.firebaseapp.com",
    databaseURL: "https://lista-spesa-b9eb1-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "lista-spesa-b9eb1",
    storageBucket: "lista-spesa-b9eb1.firebasestorage.app",
    messagingSenderId: "468690890938",
    appId: "1:468690890938:web:048be7f27779d8862d9283"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();
  const rubRef = db.ref('rubrica');

  const CAT_ICONS = { Medico:'🏥', Scuola:'🎓', Parente:'👨‍👩‍👧', Amico:'👤', Servizio:'🔧', Altro:'📌' };

  const EXAMPLE_CONTACTS = [
    { name:'Medico di Base', category:'Medico', phone:'', note:'Da compilare' },
    { name:'Pediatra', category:'Medico', phone:'', note:'Da compilare' },
    { name:'Scuola di Andrea', category:'Scuola', phone:'', note:'Pallanuoto' },
    { name:'Palestra Basket Matteo', category:'Servizio', phone:'', note:'Basket' }
  ];

  let contacts = {};
  let activeCategory = 'tutti';

  db.ref('.info/connected').on('value', snap => {
    const dot = document.getElementById('sync-dot');
    const lbl = document.getElementById('sync-label');
    if (snap.val()) { dot.className='sync-dot connected'; lbl.textContent='🟢 Sincronizzato'; }
    else { dot.className='sync-dot error'; lbl.textContent='🔴 Offline'; }
  });

  // Seed example contacts once globally using a database flag
  rubRef.on('value', snap => {
    contacts = snap.val() || {};
    render();
  });

  db.ref('rubrica_seeded').once('value', snap => {
    if (!snap.val()) {
      EXAMPLE_CONTACTS.forEach(c => rubRef.push(c));
      db.ref('rubrica_seeded').set(true);
    }
  });

  function setCat(c, btn) {
    activeCategory = c;
    document.querySelectorAll('.cf-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    render();
  }

  function render() {
    const q = document.getElementById('search').value.toLowerCase();
    const list = document.getElementById('contact-list');
    list.innerHTML = '';
    const visible = Object.entries(contacts).filter(([k, c]) => {
      const matchCat = activeCategory === 'tutti' || c.category === activeCategory;
      const matchQ   = !q || c.name.toLowerCase().includes(q) || (c.phone && c.phone.includes(q)) || (c.note && c.note.toLowerCase().includes(q));
      return matchCat && matchQ;
    });
    document.getElementById('empty-msg').style.display = visible.length === 0 ? 'block' : 'none';

    visible.forEach(([key, c]) => {
      const div = document.createElement('div');
      div.className = 'contact-item';
      const icon = CAT_ICONS[c.category] || '📌';
      div.innerHTML = `
        <div class="contact-avatar">${icon}</div>
        <div class="contact-body">
          <div class="contact-name">${escHtml(c.name)}</div>
          <div class="contact-rel"><span class="cat-badge cat-${c.category || 'Altro'}">${c.category || 'Altro'}</span></div>
          ${c.phone ? `<div class="contact-phone">📞 <a class="tel-link" href="tel:${c.phone}">${escHtml(c.phone)}</a></div>` : ''}
          ${c.note ? `<div class="contact-note">${escHtml(c.note)}</div>` : ''}
        </div>
        <button class="contact-del" onclick="deleteContact('${key}')">✕</button>
      `;
      list.appendChild(div);
    });
  }

  function deleteContact(key) {
    rubRef.child(key).remove();
    showToast('Contatto rimosso');
  }
  function addContact() {
    const name = document.getElementById('c-name').value.trim();
    const category = document.getElementById('c-cat').value;
    const phone = document.getElementById('c-phone').value.trim();
    const note = document.getElementById('c-note').value.trim();
    if (!name) { showToast('⚠️ Inserisci il nome'); return; }
    rubRef.push({ name, category, phone, note })
      .then(() => {
        document.getElementById('c-name').value = '';
        document.getElementById('c-phone').value = '';
        document.getElementById('c-note').value = '';
        showToast('✅ Contatto aggiunto!');
      })
      .catch(() => showToast('❌ Errore'));
  }

  function escHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2500);
  }
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter' && document.activeElement.closest('.form-grid')) addContact();
  });
</script>
</body>
</html>
