<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>🍽️ Menu Settimanale — Scamonzio</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; overflow-x: hidden; }
    body { font-family: 'Segoe UI', sans-serif; background: #fff8f0; min-height: 100vh; }

    .header {
      background: linear-gradient(160deg, #b5451b 0%, #e8621a 50%, #f4a261 100%);
      color: white; padding: 52px 20px 36px; text-align: center; position: relative; overflow: hidden;
    }
    .header::before {
      content: ''; position: absolute; inset: 0;
      background: radial-gradient(ellipse 60% 40% at 20% 30%, rgba(255,255,255,0.10), transparent),
                  radial-gradient(ellipse 50% 35% at 80% 70%, rgba(255,255,255,0.07), transparent);
    }
    .home-btn {
      position: absolute; top: 14px; left: 14px; z-index: 10;
      background: rgba(255,255,255,0.85); color: #e8621a; border: none; border-radius: 20px;
      padding: 6px 14px; font-size: 0.82rem; font-weight: 700; cursor: pointer;
      text-decoration: none; display: inline-flex; align-items: center; gap: 5px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.12);
    }
    .header h1 { font-size: 2rem; font-weight: 900; text-shadow: 0 3px 12px rgba(0,0,0,0.25); position: relative; }
    .header .subtitle { font-size: 0.85rem; opacity: 0.90; margin-top: 8px; font-weight: 500; position: relative; }
    .particles { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
    .particle { position: absolute; border-radius: 50%; background: rgba(255,255,255,0.18); animation: floatUp linear infinite; }
    .particle:nth-child(1) { width:8px; height:8px; left:10%; bottom:0; animation-duration:6s; animation-delay:0s; }
    .particle:nth-child(2) { width:5px; height:5px; left:25%; bottom:0; animation-duration:4.5s; animation-delay:1s; }
    .particle:nth-child(3) { width:10px; height:10px; left:42%; bottom:0; animation-duration:7s; animation-delay:2s; }
    .particle:nth-child(4) { width:6px; height:6px; left:60%; bottom:0; animation-duration:5s; animation-delay:0.5s; }
    .particle:nth-child(5) { width:12px; height:12px; left:75%; bottom:0; animation-duration:8s; animation-delay:1.5s; }
    .particle:nth-child(6) { width:4px; height:4px; left:88%; bottom:0; animation-duration:4s; animation-delay:3s; }
    @keyframes floatUp { 0%{transform:translateY(0) scale(1);opacity:0.8;} 100%{transform:translateY(-120px) scale(0.5);opacity:0;} }

    .sync-status { display:flex; align-items:center; justify-content:center; gap:6px; font-size:0.72rem; margin-top:8px; opacity:0.9; position:relative; }
    .sync-dot { width:8px; height:8px; border-radius:50%; background:#fff; animation:pulse 1.5s infinite; flex-shrink:0; }
    .sync-dot.connected { background:#a5d6a7; animation:none; }
    .sync-dot.error { background:#ef9a9a; animation:none; }
    @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.3;} }

    .wave-divider { display:block; line-height:0; overflow:hidden; background:linear-gradient(160deg,#b5451b 0%,#e8621a 50%,#f4a261 100%); }
    .wave-divider svg { display:block; width:100%; }

    .container { max-width: 540px; margin: 0 auto; padding: 18px 14px 64px; }

    /* WEEK NAV */
    .week-nav { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
    .week-nav button {
      background:white; border:2px solid #fbd5b5; border-radius:12px; padding:7px 14px;
      font-size:0.85rem; font-weight:700; color:#e8621a; cursor:pointer;
    }
    .week-nav button:hover { background:#fff3e8; }
    .week-label { font-size:0.9rem; font-weight:800; color:#bf4a1a; }

    /* ACTION BTNS */
    .action-row { display:flex; gap:8px; margin-bottom:14px; }
    .action-btn {
      flex:1; border:none; border-radius:12px; padding:10px 6px; font-size:0.78rem; font-weight:700; cursor:pointer;
      transition:all 0.2s;
    }
    .action-btn.export { background:linear-gradient(135deg,#e8621a,#f4a261); color:white; }
    .action-btn.clear  { background:white; border:2px solid #fbd5b5; color:#e8621a; }
    .action-btn:hover { opacity:0.85; }

    /* MEAL GRID */
    .meal-grid { display:flex; flex-direction:column; gap:10px; }
    .day-card { background:white; border-radius:14px; box-shadow:0 2px 10px rgba(180,80,20,0.07); border:2px solid #fde8d8; overflow:hidden; }
    .day-header { background:linear-gradient(90deg,#fff3e8,#fde8d8); padding:8px 14px; font-size:0.87rem; font-weight:800; color:#bf4a1a; }
    .meals-row { display:grid; grid-template-columns:1fr 1fr 1fr; }
    .meal-cell { padding:8px 6px; border-right:1px solid #fde8d8; cursor:pointer; min-height:52px; position:relative; transition:background 0.15s; }
    .meal-cell:last-child { border-right:none; }
    .meal-cell:hover { background:#fff8f0; }
    .meal-label { font-size:0.62rem; font-weight:800; color:#f4a261; text-transform:uppercase; letter-spacing:0.5px; margin-bottom:2px; }
    .meal-name { font-size:0.78rem; color:#444; line-height:1.3; }
    .meal-empty { font-size:0.72rem; color:#ccc; font-style:italic; }

    /* MODAL */
    .modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.4); z-index:100; align-items:center; justify-content:center; padding:16px; }
    .modal-overlay.open { display:flex; }
    .modal { background:white; border-radius:20px; padding:22px; width:100%; max-width:400px; box-shadow:0 8px 32px rgba(0,0,0,0.2); }
    .modal h3 { font-size:1rem; font-weight:800; color:#bf4a1a; margin-bottom:14px; }
    .modal input, .modal textarea {
      width:100%; border:1.5px solid #fbd5b5; border-radius:10px; padding:9px 10px; font-size:0.85rem; outline:none; font-family:inherit;
      transition:border-color 0.2s; color:#333; background:#fafafa; margin-bottom:10px; resize:vertical;
    }
    .modal input:focus, .modal textarea:focus { border-color:#e8621a; background:#fff; }
    .modal-btns { display:flex; gap:8px; }
    .modal-save { flex:1; background:linear-gradient(135deg,#e8621a,#f4a261); color:white; border:none; border-radius:10px; padding:11px; font-weight:700; font-size:0.88rem; cursor:pointer; }
    .modal-del  { background:none; border:2px solid #fbd5b5; color:#e8621a; border-radius:10px; padding:11px 14px; font-weight:700; font-size:0.85rem; cursor:pointer; }
    .modal-cancel { background:none; border:2px solid #fbd5b5; color:#999; border-radius:10px; padding:11px 14px; font-weight:700; font-size:0.85rem; cursor:pointer; }

    .page-footer { text-align:center; font-size:0.7rem; color:#d4a88a; padding:8px 0 24px; letter-spacing:0.3px; }
    .toast {
      position:fixed; bottom:20px; left:50%; transform:translateX(-50%) translateY(80px);
      background:#323232; color:#fff; padding:10px 20px; border-radius:20px; font-size:0.83rem;
      font-weight:500; transition:transform 0.3s ease; z-index:999; white-space:nowrap; max-width:calc(100vw - 32px);
    }
    .toast.show { transform:translateX(-50%) translateY(0); }
  </style>
</head>
<body>

<div class="header">
  <div class="particles">
    <div class="particle"></div><div class="particle"></div><div class="particle"></div>
    <div class="particle"></div><div class="particle"></div><div class="particle"></div>
  </div>
  <a class="home-btn" href="home.html">← Home</a>
  <h1>🍽️ Menu Settimanale</h1>
  <div class="subtitle">Pianifica i pasti della settimana</div>
  <div class="sync-status">
    <div class="sync-dot" id="sync-dot"></div>
    <span id="sync-label">Connessione in corso...</span>
  </div>
</div>

<div class="wave-divider">
  <svg viewBox="0 0 1440 72" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M0,36 C180,72 360,0 540,36 C720,72 900,0 1080,36 C1260,72 1380,12 1440,36 L1440,72 L0,72 Z" fill="#fff8f0"/>
    <path d="M0,50 C220,18 440,66 660,46 C880,26 1100,62 1320,44 L1440,50 L1440,72 L0,72 Z" fill="#fff8f0" opacity="0.55"/>
  </svg>
</div>

<div class="container">
  <div class="week-nav">
    <button onclick="changeWeek(-1)">‹ Prec</button>
    <span class="week-label" id="week-label"></span>
    <button onclick="changeWeek(1)">Succ ›</button>
  </div>

  <div class="action-row">
    <button class="action-btn export" onclick="exportToShoppingList()">🛒 Genera lista spesa</button>
    <button class="action-btn clear" onclick="clearWeek()">🗑️ Svuota settimana</button>
  </div>

  <div class="meal-grid" id="meal-grid"></div>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <h3 id="modal-title">Modifica pasto</h3>
    <input type="text" id="modal-meal" placeholder="Nome piatto..." />
    <textarea id="modal-ingredients" placeholder="Ingredienti / note (opz.)" rows="3"></textarea>
    <div class="modal-btns">
      <button class="modal-save" onclick="saveMeal()">💾 Salva</button>
      <button class="modal-del" onclick="deleteMeal()">🗑️</button>
      <button class="modal-cancel" onclick="closeModal()">✕</button>
    </div>
  </div>
</div>

<div class="page-footer">🏠 Scamonzio &nbsp;•&nbsp; Menu Settimanale</div>
<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script>
  const firebaseConfig = {
    apiKey: "AIzaSyAfOMeAkXUIandLUhCR8nfyELOPVRyD3WU",
    authDomain: "lista-spesa-b9eb1.firebaseapp.com",
    databaseURL: "https://lista-spesa-b9eb1-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "lista-spesa-b9eb1",
    storageBucket: "lista-spesa-b9eb1.firebasestorage.app",
    messagingSenderId: "468690890938",
    appId: "1:468690890938:web:048be7f27779d8862d9283"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();
  const menuRef = db.ref('menu');
  const itemsRef = db.ref('items');

  const DAYS = ['Lunedì','Martedì','Mercoledì','Giovedì','Venerdì','Sabato','Domenica'];
  const MEALS = ['Colazione','Pranzo','Cena'];
  const MEAL_ICONS = ['☕','🍽️','🌙'];

  let weekData = {};
  let weekOffset = 0;
  let editKey = null;

  db.ref('.info/connected').on('value', snap => {
    const dot = document.getElementById('sync-dot');
    const lbl = document.getElementById('sync-label');
    if (snap.val()) { dot.className='sync-dot connected'; lbl.textContent='🟢 Sincronizzato'; }
    else { dot.className='sync-dot error'; lbl.textContent='🔴 Offline'; }
  });

  function getWeekKey() {
    const now = new Date();
    const monday = new Date(now);
    const day = now.getDay() || 7;
    monday.setDate(now.getDate() - day + 1 + weekOffset * 7);
    return monday.toISOString().split('T')[0].slice(0, 7) + '-W' +
           String(monday.getDate()).padStart(2,'0');
  }

  function getWeekDates() {
    const now = new Date();
    const day = now.getDay() || 7;
    const monday = new Date(now);
    monday.setDate(now.getDate() - day + 1 + weekOffset * 7);
    const dates = [];
    for (let i = 0; i < 7; i++) {
      const d = new Date(monday);
      d.setDate(monday.getDate() + i);
      dates.push(d);
    }
    return dates;
  }

  function updateWeekLabel() {
    const dates = getWeekDates();
    const fmt = d => `${d.getDate()}/${d.getMonth()+1}`;
    document.getElementById('week-label').textContent =
      `${fmt(dates[0])} – ${fmt(dates[6])} ${dates[0].getFullYear()}`;
  }

  function changeWeek(dir) {
    weekOffset += dir;
    updateWeekLabel();
    loadWeek();
  }

  function loadWeek() {
    const wk = getWeekKey();
    menuRef.child(wk).on('value', snap => {
      weekData = snap.val() || {};
      renderGrid();
    });
  }

  function renderGrid() {
    const dates = getWeekDates();
    const grid = document.getElementById('meal-grid');
    grid.innerHTML = '';
    const wk = getWeekKey();

    dates.forEach((date, di) => {
      const dayKey = date.toISOString().split('T')[0];
      const card = document.createElement('div');
      card.className = 'day-card';
      const hdr = document.createElement('div');
      hdr.className = 'day-header';
      hdr.textContent = `${DAYS[di]} ${date.getDate()}/${date.getMonth()+1}`;
      card.appendChild(hdr);

      const row = document.createElement('div');
      row.className = 'meals-row';
      MEALS.forEach((meal, mi) => {
        const cell = document.createElement('div');
        cell.className = 'meal-cell';
        const data = weekData[dayKey] && weekData[dayKey][meal];
        cell.innerHTML = `
          <div class="meal-label">${MEAL_ICONS[mi]} ${meal}</div>
          ${data ? `<div class="meal-name">${escHtml(data.dish)}</div>` : '<div class="meal-empty">Tocca per aggiungere</div>'}
        `;
        cell.addEventListener('click', () => openModal(wk, dayKey, meal, data));
        row.appendChild(cell);
      });
      card.appendChild(row);
      grid.appendChild(card);
    });
  }

  let currentModal = {};
  function openModal(wk, dayKey, meal, data) {
    currentModal = { wk, dayKey, meal };
    document.getElementById('modal-title').textContent = `${meal} — ${dayKey.split('-').reverse().slice(0,2).join('/')}`;
    document.getElementById('modal-meal').value = data ? data.dish : '';
    document.getElementById('modal-ingredients').value = data ? (data.ingredients || '') : '';
    document.getElementById('modal-overlay').classList.add('open');
    document.getElementById('modal-meal').focus();
  }
  function closeModal() { document.getElementById('modal-overlay').classList.remove('open'); }

  function saveMeal() {
    const dish = document.getElementById('modal-meal').value.trim();
    const ingredients = document.getElementById('modal-ingredients').value.trim();
    if (!dish) { closeModal(); return; }
    const { wk, dayKey, meal } = currentModal;
    menuRef.child(`${wk}/${dayKey}/${meal}`).set({ dish, ingredients })
      .then(() => { closeModal(); showToast('✅ Pasto salvato!'); })
      .catch(() => showToast('❌ Errore'));
  }
  function deleteMeal() {
    const { wk, dayKey, meal } = currentModal;
    menuRef.child(`${wk}/${dayKey}/${meal}`).remove()
      .then(() => { closeModal(); showToast('Pasto rimosso'); })
      .catch(() => showToast('❌ Errore'));
  }

  function clearWeek() {
    if (!confirm('Svuotare tutta la settimana?')) return;
    menuRef.child(getWeekKey()).remove()
      .then(() => showToast('Settimana svuotata'))
      .catch(() => showToast('❌ Errore'));
  }

  function exportToShoppingList() {
    const ingredients = [];
    Object.values(weekData).forEach(dayMeals => {
      Object.values(dayMeals).forEach(meal => {
        if (meal.ingredients) {
          meal.ingredients.split(/[,\n]+/).forEach(ing => {
            const s = ing.trim();
            if (s) ingredients.push(s);
          });
        }
      });
    });
    if (!ingredients.length) { showToast('⚠️ Nessun ingrediente da esportare'); return; }
    const pushes = ingredients.map(name => itemsRef.push({ name, brand:'', price:0, category:'❓ Altro', checked:false }));
    Promise.all(pushes)
      .then(() => showToast(`✅ ${ingredients.length} ingredienti aggiunti alla lista spesa!`))
      .catch(() => showToast('❌ Errore'));
  }

  function escHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2500);
  }

  document.getElementById('modal-overlay').addEventListener('click', e => {
    if (e.target === document.getElementById('modal-overlay')) closeModal();
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeModal();
    if (e.key === 'Enter' && document.activeElement.id === 'modal-meal') saveMeal();
  });

  updateWeekLabel();
  loadWeek();
</script>
</body>
</html>
